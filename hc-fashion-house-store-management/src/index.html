<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy. The app talks to its own local server only; the
      one outside service allowed is Google Drive (Google sign-in and the Drive
      upload API), used only when the Google Drive module is on and staff click
      "Save to Drive" or tick the Drive box on a backup. server.js sends the
      same policy as a header and adds frame-ancestors and the report address
      there (a meta policy cannot carry them). Rich-text Terms / Notes are
      sanitized with DOMPurify, and scripts may only come from the app itself,
      so injected script tags cannot run.
      Why some entries are wider than 'self':
        - 'wasm-unsafe-eval' in script-src: the OCR engine compiles a
          WebAssembly module.
        - worker-src 'self' blob:: the OCR engine starts its worker from a
          blob URL; without worker-src it would fall back to script-src
          (no blob:) and be blocked.
        - style-src http://localhost:* http://127.0.0.1:*: html2canvas clones
          the invoice into an about:blank iframe before rasterising it.
          Firefox inherits the CSP into that iframe but resolves 'self'
          against about:blank's null origin, so the app's own stylesheet
          would be refused and the PDF would come out unstyled. Naming the
          real origin avoids that.
        - frame-src 'self' blob:: Print and Save-as-PDF render the generated
          PDF into a hidden iframe from a blob URL.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' http://localhost:* http://127.0.0.1:*; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; frame-src 'self' blob: https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" />

    <title>HC Fashion House</title>
    <!-- A private shop app: never indexed. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <!-- iOS Home Screen: Safari needs PNG apple-touch icons. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Chrome deprecated the apple-* variant. Keep both for
         cross-browser installability. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HC Fashion" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#111111" />
  </head>
  <body>
    <!--
      This file is the React app entry, never opened directly by users. It
      lives in src/ rather than the project root to keep the install folder
      uncluttered. The Vite build turns it into dist/index.html, which the
      local server (server.js) serves at http://localhost:47371/.
    -->
    <noscript>
      <div style="font-family:sans-serif;padding:2rem;max-width:600px;margin:2rem auto;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#991b1b">
        <h2>JavaScript is required</h2>
        <p>This page is the HC Fashion House app. It needs JavaScript to run.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
